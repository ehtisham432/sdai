<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Role Screens</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
        }
        .dashboard-header {
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0;
        }
        .dashboard-header .navbar { padding: 1rem 0; }
        .dashboard-header .brand, .dashboard-header .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #000 !important;
        }
        .dashboard-header .navbar-nav .nav-link { color: #666 !important; font-weight: 500; margin: 0 1rem; transition: color 0.3s; }
        .dashboard-header .navbar-nav .nav-link:hover { color: #000 !important; }
        .dashboard-header .user-info { display: flex; align-items: center; gap: 1.2rem; }
        .dashboard-header .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #e0e7ff; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 700; color: #4f46e5; }
        .container {
            max-width: 1400px;
            margin: 30px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; transform: translateY(-2px); }
        .btn-success { background: #48bb78; color: white; }
        .btn-success:hover { background: #38a169; }
        .btn-danger { background: #f56565; color: white; }
        .btn-danger:hover { background: #e53e3e; }
        .filters-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-weight: 600; color: #555; font-size: 14px; }
        .filter-group input, .filter-group select { padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .filter-actions { display: flex; gap: 10px; align-items: flex-end; }
        .form-section { background: #f8f9fa; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .screens-list { background: #f8f9fa; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .screens-list h3 { color: #333; font-size: 18px; font-weight: 600; margin-bottom: 15px; }
        .screen-group { margin-bottom: 20px; }
        .screen-group h5 { color: #667eea; font-weight: 600; margin-bottom: 10px; font-size: 14px; }
        .form-check { padding: 8px 0; margin-bottom: 5px; }
        .form-check-input { border-color: #ddd; cursor: pointer; }
        .form-check-input:checked { background-color: #667eea; border-color: #667eea; }
        .form-check-label { cursor: pointer; margin-left: 5px; color: #555; font-size: 14px; }
        .alert { padding: 12px 16px; border-radius: 5px; margin-bottom: 20px; display: none; }
        .alert.show { display: block; }
        .alert.success { background: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        .alert.error { background: #fed7d7; color: #742a2a; border: 1px solid #fc8181; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header-section h1 { margin: 0; color: #333; font-size: 28px; }
        .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        .tab-button {
            padding: 12px 20px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
        }
        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .table-responsive {
            overflow-x: auto;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #ddd;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        tr:hover {
            background: #f9f9f9;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        .action-buttons button {
            padding: 6px 12px;
            font-size: 12px;
        }
        @media (max-width: 768px) {
            .container { padding: 20px; }
            .filters-section { grid-template-columns: 1fr; }
            .filter-actions { flex-direction: column; }
            .form-actions { flex-direction: column; }
            .header-section { flex-direction: column; gap: 15px; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid px-4">
                <a class="navbar-brand" href="/pro/role-screens.html">
                    <i class="bi bi-shield-check"></i> Role Screens
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav ms-auto" id="headerMenu"></ul>
                    <div class="user-info ms-3">
                        <span id="userName" class="fw-bold"></span>
                        <span id="userRole" class="text-muted small"></span>
                        <span id="userAvatar" class="user-avatar">U</span>
                    </div>
                </div>
            </div>
        </nav>
    </div>

    <div class="container">
        <div class="header-section">
            <h1><i class="bi bi-shield-check"></i> Assign Screens to Roles</h1>
        </div>

        <div id="alert" class="alert"></div>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('search-tab', event)">Search</button>
            <button class="tab-button" onclick="switchTab('results-tab', event)">Results</button>
            <button class="tab-button" onclick="switchTab('details-tab', event)">Details</button>
        </div>

        <!-- Tab 1: Search/Filter -->
        <div id="search-tab" class="tab-content active">
            <div class="form-section">
                <div class="filters-section">
                    <div class="filter-group">
                        <label>Company:</label>
                        <select id="companyId">
                            <option value="">All Companies (Global Roles)</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Role:</label>
                        <select id="roleId"></select>
                    </div>
                    <div class="filter-actions">
                        <button id="loadBtn" class="btn-primary">Load Screens</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 2: Results -->
        <div id="results-tab" class="tab-content">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Company</th>
                            <th>Role</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <tr>
                            <td colspan="3" class="empty-state">Use Search to view results</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tab 3: Details / Edit Screens -->
        <div id="details-tab" class="tab-content">
            <div id="screensList" class="screens-list" style="display:none;">
                <h3 id="detailsTitle">Assign Screens</h3>
                <div id="groupsContainer"></div>
                <div class="form-actions">
                    <button id="closeDetailsBtn" class="btn-secondary" onclick="closeDetails()">Close</button>
                    <button id="unassignBtn" class="btn-danger">Unassign Selected</button>
                    <button id="assignBtn" class="btn-success">Assign Selected</button>
                </div>
            </div>
            <div id="emptyDetails" class="empty-state" style="display:block;">
                Select a role from Results tab to assign screens
            </div>
        </div>
    </div>

    <script src="/js/role-screens.js"></script>
</body>
</html>
