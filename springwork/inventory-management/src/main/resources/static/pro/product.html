<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/product.js"></script>
    <script src="/js/auth.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
        }
        /* Header Styles */
        .dashboard-header {
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0;
        }
        .dashboard-header .navbar { padding: 1rem 0; }
        .dashboard-header .brand, .dashboard-header .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #000 !important;
        }
        .dashboard-header .navbar-nav .nav-link { color: #666 !important; font-weight: 500; margin: 0 1rem; transition: color 0.3s; }
        .dashboard-header .navbar-nav .nav-link:hover { color: #000 !important; }
        .dashboard-header .user-info { display: flex; align-items: center; gap: 1.2rem; }
        .dashboard-header .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #e0e7ff; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 700; color: #4f46e5; }
        .container {
            max-width: 1400px;
            margin: 30px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .btn-secondary {
            background: #cbd5e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #a0aec0;
        }

        .filters-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        .filter-group input,
        .filter-group select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab-button {
            padding: 12px 20px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .table-responsive {
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #ddd;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-buttons button {
            padding: 6px 12px;
            font-size: 12px;
        }

        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
            grid-column: 1 / -1;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.2);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .details-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .details-item {
            padding: 15px;
            background: white;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .details-item strong {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
        }

        .details-item-value {
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }

        .details-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header-section h1 {
            margin: 0;
            color: #333;
            font-size: 28px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .alert.alert-danger {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }

        #imagePreview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .img-wrap {
            border: 1px solid #ddd;
            padding: 8px;
            border-radius: 4px;
        }

        .img-wrap img {
            max-width: 80px;
            max-height: 80px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .filters-section {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            td, th {
                padding: 8px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .header-section {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid px-4">
                <a class="navbar-brand" href="/pro/product.html">
                    <i class="bi bi-box"></i> Products
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav ms-auto" id="headerMenu"></ul>
                    <div class="user-info ms-3">
                        <span id="userName" class="fw-bold"></span>
                        <span id="userRole" class="text-muted small"></span>
                        <span id="userAvatar" class="user-avatar">U</span>
                    </div>
                </div>
            </div>
        </nav>
    </div>

    <div class="container">
        <div class="header-section">
            <h1><i class="bi bi-box"></i> Products</h1>
            <button class="btn-success" onclick="createNewProduct()"><i class="bi bi-plus-circle"></i> Add Product</button>
        </div>

        <div id="alert" class="alert"></div>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('filters-tab', event)">Search</button>
            <button class="tab-button" onclick="switchTab('results-tab', event)">Results</button>
            <button class="tab-button" onclick="switchTab('details-tab', event)">Details / Create</button>
        </div>

        <!-- Tab 1: Search/Filter -->
        <div id="filters-tab" class="tab-content active">
            <div class="filters-section">
                <div class="filter-group">
                    <label>Company: <span style="color:red">*</span></label>
                    <select id="companyFilter" required>
                        <option value="">Select a company</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn-primary" onclick="performSearch()">🔍 Search</button>
                    <button class="btn-secondary" onclick="resetFilters()">↻ Reset</button>
                </div>
            </div>
        </div>

        <!-- Tab 2: Search Results -->
        <div id="results-tab" class="tab-content">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Price</th>
                            <th>Category</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <tr>
                            <td colspan="5" class="empty-state">Use Search to find products</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tab 3: Details / Create -->
        <div id="details-tab" class="tab-content">
            <div id="detailsAlert" class="alert"></div>

            <!-- Product Details View -->
            <div id="productDetailsContainer" style="display:none;">
                <div class="details-section">
                    <h2 style="margin-bottom: 20px; color: #333;" id="productDetailsTitle">Product Details</h2>
                    <div id="productDetails"></div>
                    
                    <div class="details-actions">
                        <button type="button" class="btn-secondary" onclick="closeDetailsView()">Close</button>
                        <button type="button" class="btn-primary" id="editBtn" onclick="editProduct()">Edit</button>
                        <button type="button" class="btn-danger" id="deleteBtn" onclick="deleteProduct()">Delete</button>
                    </div>
                </div>
            </div>

            <!-- Create/Edit Product Form -->
            <div id="productFormContainer">
                <div class="form-section">
                    <h2 style="margin-bottom: 20px; color: #333;" id="formTitle">New Product</h2>

                    <form id="productForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Company*</label>
                                <select id="productCompany" required>
                                    <option value="">Select a company</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Product Name*</label>
                                <input type="text" id="productName" required>
                            </div>

                            <div class="form-group">
                                <label>Price*</label>
                                <input type="number" id="productPrice" required min="0" step="0.01">
                            </div>

                            <div class="form-group">
                                <label>Category*</label>
                                <select id="productCategory" required>
                                    <option value="">Select a category</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Type</label>
                                <select id="productType">
                                    <option value="">Select a type</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Description</label>
                                <textarea id="productDescription"></textarea>
                            </div>

                            <div class="form-group">
                                <label>Product Images</label>
                                <input type="file" id="productImages" multiple accept="image/*">
                                <div id="imagePreview"></div>
                                <div class="form-text mt-2">Click a preview to mark it as the title image.</div>
                                <input type="hidden" id="titleImageSelection">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn-secondary" onclick="closeDetailsView()">Cancel</button>
                            <button type="submit" class="btn-primary">Save Product</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
